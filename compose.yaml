services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: auto_finance
      POSTGRES_USER: auto_finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente local}
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'auto_finance', '-d', 'auto_finance']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
