env:
  contexts:
    - name: Auto Finance descartável
      urls:
        - http://127.0.0.1:3107
  parameters:
    failOnError: true
    failOnWarning: true
    progressToStdout: true
jobs:
  - type: requestor
    requests:
      - url: http://127.0.0.1:3107/
        responseCode: 200
      - url: http://127.0.0.1:3107/api/health
        responseCode: 200
      - url: http://127.0.0.1:3107/api/auth/session
        responseCode: 401
  - type: passiveScan-wait
    parameters:
      maxDuration: 2
  - type: report
    parameters:
      template: traditional-json
      reportDir: ${ZAP_REPORT_DIR}
      reportFile: zap-passive.json
  - type: exitStatus
    parameters:
      errorLevel: Medium
